<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크리스마스 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #1b2a4e;
    --sky-bottom: #3a4f86;
    --cream: #fff8e7;
    --wood: #8b5a2b;
    --wood-dark: #6b4220;
    --text: #4a3426;
    --muted: #a08670;
    --green: #4cbb6c;
    --green-dark: #2f8f4c;
    --red: #e8584f;
    --red-dark: #b83a33;
    --line: #ecdcc0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #2c3f73 0%, #141d36 70%);
    color: var(--text);
    font-family: "Jua", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app { width: 100%; max-width: 440px; }

  /* ── 시간 표시 (나무 간판) ── */
  .sign {
    position: relative;
    background: var(--cream);
    border: 5px solid var(--wood);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0,0,0,.35);
    padding: 10px 16px 6px;
    margin: 0 auto 20px;
    text-align: center;
    width: fit-content;
    min-width: 260px;
  }
  .sign::before, .sign::after {
    content: "";
    position: absolute;
    top: -14px;
    width: 10px; height: 14px;
    background: var(--wood);
    border-radius: 3px;
  }
  .sign::before { left: 40px; }
  .sign::after { right: 40px; }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 15vw, 68px);
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .display .ms { color: var(--muted); font-size: .7em; }

  /* ── 장면 ── */
  .scene {
    border-radius: 28px;
    overflow: hidden;
    border: 5px solid var(--cream);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    margin-bottom: 22px;
  }
  .scene svg { display: block; width: 100%; height: auto; }

  /* 캐릭터 애니메이션 */
  .bob {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: bob 1.8s ease-in-out infinite;
  }
  .running .bob { animation: dance .55s ease-in-out infinite; }
  .bob.d2 { animation-delay: -.6s; }
  .bob.d3 { animation-delay: -1.2s; }
  .running .bob.d2 { animation-delay: -.18s; }
  .running .bob.d3 { animation-delay: -.36s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-9px) rotate(5deg); }
  }

  .arm { transform-box: fill-box; transform-origin: 50% 8%; }
  .running .arm { animation: wave .55s ease-in-out infinite alternate; }
  .running .arm.l { animation-direction: alternate-reverse; }
  @keyframes wave {
    from { transform: rotate(-35deg); }
    to { transform: rotate(25deg); }
  }

  .blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.5s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 2s ease-in-out infinite; }
  .running .tail { animation-duration: .6s; }
  @keyframes swish {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(12deg); }
  }

  .light { animation: twinkle 1.6s ease-in-out infinite; }
  .running .light { animation-duration: .5s; }
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .star { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  .running .star { animation: spin 3s linear infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glow { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { opacity: .25; }
    50% { opacity: .5; }
  }

  .flake { animation: fall linear infinite; }
  @keyframes fall {
    0% { transform: translate(0, 0); }
    50% { transform: translate(8px, 160px); }
    100% { transform: translate(-4px, 320px); }
  }

  /* ── 버튼 ── */
  .controls {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
  }
  button {
    flex: 1;
    height: 64px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 22px;
    cursor: pointer;
    color: var(--text);
    background: var(--cream);
    box-shadow: 0 6px 0 #d6c3a0;
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #d6c3a0; }
  button:disabled { opacity: .5; cursor: default; }
  button.start { background: var(--green); color: #fff; box-shadow: 0 6px 0 var(--green-dark); }
  button.start:active { box-shadow: 0 2px 0 var(--green-dark); }
  button.stop { background: var(--red); color: #fff; box-shadow: 0 6px 0 var(--red-dark); }
  button.stop:active { box-shadow: 0 2px 0 var(--red-dark); }

  /* ── 랩 기록 ── */
  .laps {
    list-style: none;
    margin: 0;
    padding: 4px 18px;
    background: var(--cream);
    border-radius: 20px;
    box-shadow: 0 6px 0 #d6c3a0;
  }
  .laps:empty { display: none; }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 2px dashed var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
  }
  .laps li:last-child { border-bottom: none; }
  .laps li.best { color: var(--green-dark); }
  .laps li.worst { color: var(--red-dark); }

  .hint {
    text-align: center;
    color: #c9d3ee;
    font-size: 14px;
    margin-top: 22px;
  }
  kbd {
    background: rgba(255,255,255,.12);
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
  }

  /* 랩 점프 · 장식 던지기용 래퍼 */
  .jump, .toss { transform-box: fill-box; transform-origin: 50% 100%; }

  /* 정지 시 별 반짝임 */
  .sparkles { opacity: 0; transition: opacity .4s; }
  .shining .sparkles { opacity: 1; }
  .sparkles path {
    transform-box: fill-box;
    transform-origin: center;
    animation: sparkle 1.1s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(0) rotate(0deg); }
    50% { transform: scale(1) rotate(45deg); }
  }
  .shining .star { animation: shine .45s ease-in-out infinite alternate; }
  @keyframes shine {
    from { transform: scale(1); fill: #ffd34d; }
    to { transform: scale(1.25); fill: #fffbe0; }
  }
  .glow { transform-box: fill-box; transform-origin: center; }
  .shining .glow { animation: glowStrong .45s ease-in-out infinite alternate; }
  @keyframes glowStrong {
    from { opacity: .5; transform: scale(1); }
    to { opacity: 1; transform: scale(1.6); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

          <circle cx="18" cy="-18" r="8" fill="#a0704a"/>

          <circle cx="18" cy="-18" r="4" fill="#e8c9a0"/>
          <circle cx="0" cy="0" r="24" fill="#a0704a"/>

        </g>
      </g></g></g>

      <!-- 토끼 -->
      <g transform="translate(330,198)"><g class="jump" id="rabbit"><g class="toss">
        <g class="bob d2">
          <ellipse cx="-10" cy="55" rx="9" ry="5" fill="#e6dccb"/>

          <ellipse class="arm l" cx="-20" cy="32" rx="5.5" ry="11" fill="#f7f1e8"/>
          <ellipse cx="0" cy="36" rx="20" ry="20" fill="#f7f1e8"/>
          <ellipse class="arm" cx="20" cy="32" rx="5.5" ry="11" fill="#f7f1e8"/>

  <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 초기화</p>
</main>

<script>
  /* ── 장면 꾸미기: 트리 조명 & 눈 ── */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const lightColors = ['#ff5a5a', '#ffd34d', '#5ab0ff', '#ff8fd0', '#ffffff'];
  const lightSpots = [
    [186, 92], [214, 104], [178, 118], [222, 122],
    [158, 160], [200, 152], [242, 164], [222, 140], [178, 142],
    [140, 218], [172, 202], [210, 212], [250, 204], [266, 226], [196, 184], [156, 190], [232, 188]
  ];
  const lightsEl = document.getElementById('lights');
  lightSpots.forEach(([x, y], i) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 4.5);
    c.setAttribute('fill', lightColors[i % lightColors.length]);
    c.setAttribute('class', 'light');
    c.style.animationDelay = (-Math.random() * 1.6).toFixed(2) + 's';
    lightsEl.appendChild(c);
  });

  const snowEl = document.getElementById('snow');
  for (let i = 0; i < 45; i++) {
    const f = document.createElementNS(SVG_NS, 'circle');
    f.setAttribute('cx', (Math.random() * 400).toFixed(1));
    f.setAttribute('cy', -10);
    f.setAttribute('r', (1 + Math.random() * 2).toFixed(1));
    f.setAttribute('opacity', (0.5 + Math.random() * 0.5).toFixed(2));
    f.setAttribute('class', 'flake');
    const dur = 7 + Math.random() * 7;
    f.style.animationDuration = dur.toFixed(2) + 's';
    f.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
    snowEl.appendChild(f);
  }

  /* ── 캐릭터: 장식 달기 & 점프 ── */
  const decorEl = document.getElementById('decor');
  const decorColors = ['#e8584f', '#ffd34d', '#5ab0ff', '#b27ee8', '#ff8fd0'];
  const decorSpots = [
    [200, 76], [196, 108], [198, 138], [185, 165], [165, 170], [218, 170],
    [190, 205], [230, 205], [150, 212], [168, 222], [214, 226], [244, 222]
  ];
  // hand: 장식을 던지는 손 위치(장면 좌표), dir: 트리 쪽 방향
  const chars = [
    { id: 'bear',   hand: [92, 226],  dir: 1 },
    { id: 'cat',    hand: [262, 228], dir: -1 },
    { id: 'rabbit', hand: [310, 226], dir: -1 }
  ].map(c => {
    const jump = document.getElementById(c.id);
    return { ...c, jump, toss: jump.querySelector('.toss') };
  });

  let decorOrder = [];
  let decorIdx = 0;
  let charIdx = 0;
  let decorTimer = null;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function resetDecor() {
    decorEl.innerHTML = '';
    decorOrder = shuffle(decorSpots.slice());
    decorIdx = 0;
    charIdx = 0;
  }

  function makeOrnament(x, y, color) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.style.transformBox = 'fill-box';
    g.style.transformOrigin = 'center';
    g.innerHTML =
      `<rect x="${x - 2}" y="${y - 9.5}" width="4" height="3.5" rx="1" fill="#d9a400"/>` +
      `<circle cx="${x}" cy="${y}" r="6.5" fill="${color}"/>` +
      `<circle cx="${x - 2.2}" cy="${y - 2.2}" r="1.8" fill="#fff" opacity=".75"/>`;
    return g;
  }

  function decorateStep() {
    if (decorIdx >= decorOrder.length) return;   // 트리가 다 꾸며졌으면 그만
    const [x, y] = decorOrder[decorIdx];
    const color = decorColors[decorIdx % decorColors.length];
    decorIdx++;
    const c = chars[charIdx++ % chars.length];

    // 캐릭터가 트리 쪽으로 몸을 기울여 던지기
    c.toss.animate([
      { transform: 'none' },
      { transform: `translateX(${c.dir * 6}px) rotate(${c.dir * 12}deg)`, offset: .35 },
      { transform: 'none' }
    ], { duration: 600, easing: 'ease-in-out' });

    // 장식이 손에서 포물선을 그리며 트리에 붙기
    const orn = makeOrnament(x, y, color);
    decorEl.appendChild(orn);
    const dx = c.hand[0] - x;
    const dy = c.hand[1] - y;
    orn.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(.5)` },
      { transform: `translate(${dx * .45}px, ${dy * .45 - 55}px) scale(.9)`, offset: .55 },
      { transform: 'translate(0, 0) scale(1.35)', offset: .85 },
      { transform: 'translate(0, 0) scale(1)' }
    ], { duration: 750, delay: 180, easing: 'ease-out', fill: 'both' });
  }

  function startDecorating() {
    stopDecorating();
    decorateStep();
    decorTimer = setInterval(decorateStep, 1100);
  }

  function stopDecorating() {
    clearInterval(decorTimer);
    decorTimer = null;
  }

  function jumpAll() {
    chars.forEach((c, i) => c.jump.animate([
      { transform: 'translateY(0) scale(1, 1)' },
      { transform: 'translateY(2px) scale(1.1, .88)', offset: .15 },
      { transform: 'translateY(-32px) scale(.95, 1.06)', offset: .5 },
      { transform: 'translateY(0) scale(1.08, .92)', offset: .85 },
      { transform: 'translateY(0) scale(1, 1)' }
    ], { duration: 560, delay: i * 90, easing: 'ease-out' }));
  }

  resetDecor();

  /* ── 스탑워치 로직 ── */
  const app = document.getElementById('app');
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let lapStart = 0;    // 현재 랩이 시작된 누적 시간
  let laps = [];       // 각 랩의 소요 시간(ms)
  let rafId = null;

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function format(ms, withSpan = false) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' : '') + pad(m) + ':' + pad(s);
    const frac = '.' + pad(cs);
    return withSpan ? main + '<span class="ms">' + frac + '</span>' : main + frac;
  }

  function render() {
    display.innerHTML = format(now(), true);
    const current = lapsEl.querySelector('li.current span:last-child');
    if (current) current.textContent = format(now() - lapStart);
    if (running) rafId = requestAnimationFrame(render);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (!running && laps.length === 0 && elapsed === 0) return;

    const cur = document.createElement('li');
    cur.className = 'current';
    cur.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${format(now() - lapStart)}</span>`;
    lapsEl.appendChild(cur);

    let best = -1, worst = -1;
    if (laps.length >= 2) {
      best = laps.indexOf(Math.min(...laps));
      worst = laps.indexOf(Math.max(...laps));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (i === best) li.className = 'best';
      if (i === worst) li.className = 'worst';
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${format(laps[i])}</span>`;
      lapsEl.appendChild(li);
    }
  }

  function updateButtons() {
    app.classList.toggle('running', running);
    if (running) {
      startBtn.textContent = '정지';
      startBtn.className = 'stop';
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    } else {
      startBtn.textContent = '시작';
      startBtn.className = 'start';
      lapBtn.textContent = elapsed === 0 ? '랩' : '재설정';
      lapBtn.disabled = elapsed === 0;
    }
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      stopDecorating();
      app.classList.add('shining');      // 정지 → 별이 반짝반짝
    } else {
      startTime = performance.now();
      running = true;
      rafId = requestAnimationFrame(render);
      app.classList.remove('shining');
      startDecorating();                  // 시작 → 트리에 장식 달기
    }
    updateButtons();
    renderLaps();
    render();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
    jumpAll();                            // 랩 → 다 같이 점프
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lapStart = 0;
    laps = [];
    app.classList.remove('shining');
    resetDecor();
    renderLaps();
    render();
    updateButtons();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  render();
</script>
</body>
</html>
